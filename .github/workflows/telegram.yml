# Posts each new guide once to @mycytax after Build site has committed the
# pages on main. The job waits until the guide URL returns HTTP 200 before
# sendMessage, so the link preview is the live page. Guides have no images.
#
# Dedup state lives in source/content/telegram-posted.json. This workflow
# commits that file with GITHUB_TOKEN, which does not start other workflows.
# The commit message also contains [skip ci]. build.yml ignores that path, so
# a state commit cannot rebuild the site or post again.
#
# Repository secret: TELEGRAM_BOT_TOKEN. If it is unset the job logs a notice,
# does not change the state file and exits green. The value is never printed.
# The dry_run dispatch input prints the messages and does not call Telegram.
# Channel: TELEGRAM_CHANNEL, default @mycytax.
name: Post to Telegram

on:
  workflow_run:
    workflows: ["Build site"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the Telegram messages and do not send them"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post new guides
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@mycytax"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.dry_run == 'true' || github.event.inputs.dry_run == true) }}
          PUSH_STATE: "1"
          BASE: https://mycytax.com
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            echo "TELEGRAM_BOT_TOKEN is configured (value not printed)."
          else
            echo "TELEGRAM_BOT_TOKEN is not set (value not printed)."
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: messages are printed below and nothing is sent."
          fi
          python3 source/telegram_post.py
